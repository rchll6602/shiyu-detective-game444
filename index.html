<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>第四章｜南洋美食译码局</title><style>
:root{--red:#741924;--red2:#aa2635;--gold:#e8b85c;--cream:#fff3d8;--ink:#422521;--green:#256a52}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 90% 5%,#b94b40 0,transparent 34%),linear-gradient(145deg,#4d1020,#8c1e2b 65%,#3d111e);font-family:system-ui,'Microsoft YaHei',sans-serif;color:var(--cream)}button,a{font:inherit}button{cursor:pointer}.wrap{max-width:850px;margin:auto;padding:18px 14px 45px}.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:12px;letter-spacing:2px;color:#f4c876}.back{border:1px solid #f5ce8a;color:#ffdda0;background:#40101c;border-radius:30px;padding:10px 14px;font-size:13px}.hero{text-align:center;border:1px solid #d8a65a80;background:linear-gradient(150deg,#a62b37,#641526);border-radius:25px;padding:25px 18px;box-shadow:0 16px 38px #1d071670}.eyebrow{font-size:12px;letter-spacing:4px;color:#ffe1a6}.hero h1{font-size:clamp(30px,7vw,48px);margin:8px 0;color:#ffe4a8;letter-spacing:2px}.hero p{font-size:14px;line-height:1.8;max-width:610px;margin:10px auto}.emblem{font-size:45px;margin:9px}.panel{margin-top:15px;background:#fff8e9;color:var(--ink);border-radius:22px;padding:23px 18px;box-shadow:0 12px 32px #21060c65}.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.tag{background:#f7e7c4;border-radius:25px;padding:7px 12px;font-size:13px;font-weight:700}.bar{height:9px;background:#ecd6ad;border-radius:30px;overflow:hidden;margin:16px 0}.fill{height:100%;background:linear-gradient(90deg,#a72a36,#e2a845);width:0;transition:width .3s}.title{font-size:25px;font-weight:850;color:#7b1d28;margin:9px 0}.desc{font-size:15px;line-height:1.8;color:#71504a}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:18px 0}.option{border:2px solid #e5c99c;background:white;border-radius:15px;min-height:73px;padding:14px 10px;color:#522922;font-weight:750;text-align:center;transition:.15s}.option:active{transform:scale(.98)}.option.selected{border-color:#a32d3a;background:#ffe5d3}.option.correct{background:#d5efdc;border-color:#25845e}.option.wrong{background:#f8d7d3;border-color:#b32c37}.option:disabled{cursor:default}.primary{background:linear-gradient(120deg,#87202e,#b93d37);border:0;color:#fff4d8;border-radius:14px;padding:14px 22px;font-weight:800;box-shadow:0 5px 0 #5d1a22}.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}.secondary{background:#f6e8ce;border:1px solid #c7a97b;color:#6b2730;border-radius:12px;padding:12px 16px;font-weight:700}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:16px}.feedback{border-radius:14px;background:#f9ebce;padding:15px;line-height:1.8;margin-top:13px;font-size:14px;border-left:5px solid #b98737}.feedback.good{background:#e1f2e3;border-left-color:#2d8357}.feedback.bad{background:#ffebdf;border-left-color:#b6383c}.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.pair-col{display:flex;flex-direction:column;gap:9px}.pair-item{border:2px solid #e1c18c;background:white;border-radius:13px;min-height:59px;padding:10px;color:#552b28;font-weight:750}.pair-item.active{background:#ffe0a7;border-color:#a82d3b}.pair-item.matched{background:#dceee0;border-color:#388d62;color:#2d6347}.pair-item:disabled{opacity:.85}.small{font-size:12px;color:#82655c}.stamp{width:175px;height:175px;border:7px double #e7b458;border-radius:50%;background:radial-gradient(circle,#a92a35,#6e1524);color:#ffe2a1;display:grid;place-content:center;text-align:center;margin:20px auto;transform:rotate(-8deg);box-shadow:0 8px 25px #5b1b2255}.stamp b{font-size:25px;letter-spacing:4px}.stamp span{font-size:12px;margin-top:6px}.hide{display:none!important}.foot{text-align:center;font-size:12px;color:#f1c68d;margin-top:18px;line-height:1.8}.note{font-size:13px;line-height:1.7;color:#81645b}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{padding:8px 11px;background:#f1dfbd;border-radius:25px;font-size:13px}.chapter{font-size:13px;letter-spacing:2px;color:#d9a94f;font-weight:700}@media(max-width:450px){.panel{padding:18px 13px}.cards{gap:8px}.option{font-size:14px;min-height:68px}.hero{padding:21px 14px}.back{font-size:12px;padding:9px}}
</style></head><body><main class="wrap"><div class="mast"><div class="brand">食语侦探社 · CASE 04</div><button class="back" id="returnTop">↩ 关闭游戏 · 返回电子书</button></div><header class="hero"><div class="eyebrow">第四章 · 外来词档案</div><div class="emblem">🗝️ 🍛 🥤</div><h1>南洋美食译码局</h1><p>一张神秘的南洋菜单出现了！破解来自不同语言的美食名称，完成四项调查，取得专属「外来词印章」。</p></header><section class="panel" id="screen"><div class="chapter">DETECTIVE BRIEFING</div><div class="title">译码任务已启动</div><p class="desc">外来词是从其他语言借入的词语。马来西亚的饮食名称反映了不同语言与文化之间的交流。你将通过配对、解码、辨析和密码推理找出线索。</p><div class="pills"><span class="pill">① 名称配对</span><span class="pill">② 菜单解码</span><span class="pill">③ 词源辨析</span><span class="pill">④ 终极密码</span></div><div class="controls"><button class="primary" id="start">开始调查 →</button></div></section><div class="foot">建议从 Heyzine 以「新标签页」打开游戏，以保留原本的阅读位置。</div></main><script>
const BOOK='https://heyzine.com/flip-book/93e87995ba.html';const $=s=>document.querySelector(s);let stage=0,score=0,answered=false,selected=[],matched=new Set(),first=null;const screen=$('#screen');function returnBook(){if(window.opener){window.close();setTimeout(()=>{if(!document.hidden)location.href=BOOK},500)}else{window.close();setTimeout(()=>{if(!document.hidden){showReturnFallback()}},450)}}function showReturnFallback(){const old=$('#returnFallback');if(old)return;let el=document.createElement('div');el.id='returnFallback';el.className='panel';el.innerHTML='<strong>浏览器未允许自动关闭此标签页。</strong><p class="desc">请手动关闭游戏标签页，即可回到原本的阅读位置；或使用下方备用链接。</p><a class="primary" style="display:inline-block;text-decoration:none" href="'+BOOK+'" target="_blank" rel="noopener">📖 打开原本的 Heyzine 电子书</a>';document.querySelector('.wrap').appendChild(el);el.scrollIntoView({behavior:'smooth',block:'center'})}$('#returnTop').onclick=returnBook;$('#start').onclick=()=>render(1);function head(num,name,detail){return `<div class="stats"><span class="tag">调查 ${num} / 4</span><span class="tag">得分 ${score} / 100</span></div><div class="bar"><div class="fill" style="width:${(num-1)*25}%"></div></div><div class="chapter">${['','MISSION 01 · MATCH','MISSION 02 · DECODE','MISSION 03 · TRACE','MISSION 04 · FINAL'][num]}</div><div class="title">${name}</div><p class="desc">${detail}</p>`}function nextBtn(){return '<div class="controls"><button class="primary" id="next" disabled>下一项调查 →</button></div>'}function reveal(good,explanation,points=25){if(answered)return;answered=true;if(good)score+=points;$('#feedback').className='feedback '+(good?'good':'bad');$('#feedback').innerHTML='<strong>'+(good?'✓ 线索破解成功！':'✦ 已记录正确线索')+'</strong><div>'+explanation+'</div>';$('#feedback').classList.remove('hide');$('#next').disabled=false;$('#next').onclick=()=>render(stage+1)}function render(n){stage=n;answered=false;selected=[];matched=new Set();first=null;window.scrollTo({top:0,behavior:'smooth'});if(n===1)pair();if(n===2)decode();if(n===3)trace();if(n===4)finalMission();if(n===5)result()}
function pair(){const pairs=[['Roti canai','印度煎饼'],['Teh tarik','拉茶'],['Nasi lemak','椰浆饭'],['Satay','沙爹']];const right=[pairs[2],pairs[0],pairs[3],pairs[1]];screen.innerHTML=head(1,'街市招牌配对','点选左侧的美食名称，再点选右侧对应的中文名称。四组全部匹配即可解锁线索。')+`<div class="pair-grid"><div class="pair-col">${pairs.map((p,i)=>`<button class="pair-item" data-side="l" data-id="${i}">${p[0]}</button>`).join('')}</div><div class="pair-col">${right.map(p=>`<button class="pair-item" data-side="r" data-id="${pairs.indexOf(p)}">${p[1]}</button>`).join('')}</div></div><div class="small" id="pairCount">已配对 0 / 4</div><div id="feedback" class="feedback hide"></div>${nextBtn()}`;document.querySelectorAll('.pair-item').forEach(b=>b.onclick=()=>{if(answered||b.disabled)return;if(!first){if(b.dataset.side!=='l')return;first=b;b.classList.add('active');return}if(b===first){first.classList.remove('active');first=null;return}if(b.dataset.side==='l'){first.classList.remove('active');first=b;b.classList.add('active');return}if(b.dataset.id===first.dataset.id){b.classList.add('matched');first.classList.remove('active');first.classList.add('matched');b.disabled=true;first.disabled=true;matched.add(b.dataset.id);$('#pairCount').textContent=`已配对 ${matched.size} / 4`;if(matched.size===4)reveal(true,'这些美食名称常见于马来西亚多语环境。借用原语名称时，中文也常使用音译、意译或沿用原名。')}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),450)}first.classList.remove('active');first=null})}
function decode(){const options=['拉茶：将茶在两个容器间反复倒拉，形成泡沫','拉茶：在茶中加入拉面','拉茶：只使用冷水泡制的茶','拉茶：只在节庆时饮用的茶'];screen.innerHTML=head(2,'菜单译码：Teh tarik','一名游客看不懂菜单上的「Teh tarik」。请选择最准确的中文说明。')+`<div class="cards">${options.map((v,i)=>`<button class="option" data-i="${i}">${v}</button>`).join('')}</div><div id="feedback" class="feedback hide"></div>${nextBtn()}`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered)return;const i=+b.dataset.i;b.classList.add(i===0?'correct':'wrong');document.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(+x.dataset.i===0)x.classList.add('correct')});reveal(i===0,'「Teh」指茶，「tarik」在马来语中有“拉”的意思。拉茶的名称与制作动作有关。')})}
function trace(){screen.innerHTML=head(3,'词源档案：辨别借词','以下哪一项最能说明「外来词」在马来西亚饮食语言中的形成方式？')+`<div class="cards"><button class="option" data-i="0">把所有食物名称改成古代汉语</button><button class="option" data-i="1">不同语言接触后，借用或转写其他语言的名称</button><button class="option" data-i="2">只用网络流行语给食物命名</button><button class="option" data-i="3">每种食物只能有一个语言名称</button></div><div id="feedback" class="feedback hide"></div>${nextBtn()}`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered)return;const i=+b.dataset.i;b.classList.add(i===1?'correct':'wrong');document.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(+x.dataset.i===1)x.classList.add('correct')});reveal(i===1,'外来词来自语言接触与借用。饮食名称在不同语言之间流通时，可能保留原名、采用音译，或出现中文解释。')})}
function finalMission(){screen.innerHTML=head(4,'终极密码：跨语言菜单','请依次选出符合「原语名称 → 常见中文名称」的三组配对。选中正确的三项即可解锁印章。')+`<div class="cards"><button class="option" data-i="0">Nasi lemak → 椰浆饭</button><button class="option" data-i="1">Roti canai → 沙爹</button><button class="option" data-i="2">Satay → 沙爹</button><button class="option" data-i="3">Teh tarik → 拉茶</button><button class="option" data-i="4">Nasi lemak → 咖喱角</button><button class="option" data-i="5">Roti canai → 椰浆饭</button></div><p class="note">请选择三项正确配对，然后按「提交密码」。</p><div class="controls"><button class="secondary" id="reset">清除选择</button><button class="primary" id="submit" disabled>提交密码（0/3）</button></div><div id="feedback" class="feedback hide"></div>${nextBtn()}`;const submit=$('#submit');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered)return;let i=+b.dataset.i;if(selected.includes(i)){selected=selected.filter(v=>v!==i);b.classList.remove('selected')}else if(selected.length<3){selected.push(i);b.classList.add('selected')}submit.disabled=selected.length!==3;submit.textContent=`提交密码（${selected.length}/3）`});$('#reset').onclick=()=>{if(answered)return;selected=[];document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));submit.disabled=true;submit.textContent='提交密码（0/3）'};submit.onclick=()=>{if(answered)return;let good=[0,2,3].every(v=>selected.includes(v));document.querySelectorAll('.option').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if([0,2,3].includes(i))b.classList.add('correct');else if(selected.includes(i))b.classList.add('wrong')});submit.disabled=true;$('#reset').disabled=true;reveal(good,'正确密码：Nasi lemak＝椰浆饭、Satay＝沙爹、Teh tarik＝拉茶。不同语言的名称共同记录了马来西亚的饮食交流。')};}
function result(){const perfect=score===100;screen.innerHTML=`<div class="chapter">CASE CLOSED · CHAPTER 04</div><div class="title" style="text-align:center">${perfect?'译码任务圆满完成！':'调查完成，外来词档案已解锁！'}</div><div class="stamp"><div>✦ ✦ ✦</div><b>外来词</b><b>印章</b><span>南洋美食译码局</span></div><p class="desc" style="text-align:center">最终得分：<strong style="font-size:29px;color:#a22936">${score} / 100</strong></p><p class="desc" style="text-align:center">${perfect?'你成功辨认了借词与饮食名称背后的文化联系。':'你已完成四项任务！可以重新挑战，争取满分。'}</p><div class="controls"><button class="secondary" id="again">↻ 再挑战一次</button><button class="primary" id="returnEnd">📖 关闭游戏 · 返回电子书</button></div><p class="note" style="text-align:center">返回时优先关闭当前游戏标签页，以保留原本的 Heyzine 阅读位置。</p>`;$('#again').onclick=()=>{score=0;render(1)};$('#returnEnd').onclick=returnBook}
</script></body></html>
